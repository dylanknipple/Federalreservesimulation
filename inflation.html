<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federal Reserve Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .dashboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        .stat {
            text-align: center;
        }
        .stat h2 {
            margin: 0;
            font-size: 24px;
            color: #2980b9;
        }
        .stat p {
            margin: 5px 0 0;
            color: #7f8c8d;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .controls input[type="range"] {
            width: 100%;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #219a52;
        }
        .log {
            background: #2c3e50;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Federal Reserve Simulator</h1>
        <div class="dashboard">
            <div class="stat">
                <h2 id="quarterVal">Q1</h2>
                <p>Quarter</p>
            </div>
            <div class="stat">
                <h2 id="inflationVal">8.5%</h2>
                <p>Inflation</p>
            </div>
            <div class="stat">
                <h2 id="gdpVal">2.1%</h2>
                <p>GDP Growth</p>
            </div>
            <div class="stat">
                <h2 id="unemploymentVal">4.2%</h2>
                <p>Unemployment</p>
            </div>
            <div class="stat">
                <h2 id="confidenceVal">55</h2>
                <p>Confidence</p>
            </div>
        </div>
        <div class="controls">
            <label for="rateSlider">Interest Rate: <span id="rateSliderVal">5.25%</span></label>
            <input type="range" id="rateSlider" min="0" max="15" step="0.25" value="5.25">
        </div>
        <button class="btn" id="nextQuarterBtn">Next Quarter</button>
        <h3>Federal Reserve Log:</h3>
        <div class="log" id="logContainer">
            <p>Welcome to the Federal Reserve Simulator. Bring inflation down to 2.0%.</p>
        </div>
    </div>

    <script>
        // Core Engine Variables
        let quarter = 1;
        let inflation = 8.5;
        let gdp = 2.1;
        let unemployment = 4.2;
        let confidence = 55;
        let interestRate = 5.25;

        let inflationExpectations = 6.0;
        let naturalRateUnemployment = 4.5;
        let potentialGdpGrowth = 2.5;

        // Interface Mapping
        const rateSlider = document.getElementById('rateSlider');
        const rateSliderVal = document.getElementById('rateSliderVal');
        const nextQuarterBtn = document.getElementById('nextQuarterBtn');
        const logContainer = document.getElementById('logContainer');

        const inflationVal = document.getElementById('inflationVal');
        const gdpVal = document.getElementById('gdpVal');
        const unemploymentVal = document.getElementById('unemploymentVal');
        const confidenceVal = document.getElementById('confidenceVal');
        const quarterVal = document.getElementById('quarterVal');

        // Target Sliders Readout Listener
        rateSlider.addEventListener('input', (e) => {
            interestRate = parseFloat(e.target.value);
            rateSliderVal.innerText = interestRate.toFixed(2) + '%';
        });

        // Advance Game Steps Trigger
        nextQuarterBtn.addEventListener('click', () => {
            quarter++;
            updateEconomy();
            updateInterface();
        });

        function updateEconomy() {
            let realInterestRate = interestRate - inflation;
            let contractionStrength = realInterestRate - 0.5;

            // 1. Balanced Output Mechanics
            let economicShock = contractionStrength * 0.45;
            gdp = potentialGdpGrowth + economicShock - (unemployment - naturalRateUnemployment) * 0.3;
            gdp = Math.max(-6.0, Math.min(6.5, gdp));

            // 2. Fixed Employment System (No more signs flipping)
            let gdpImpact = gdp < 0 ? Math.abs(gdp) * 0.22 : -(gdp * 0.12);
            let policyLagUnemployment = contractionStrength > 0 ? contractionStrength * 0.15 : contractionStrength * 0.05;
            unemployment = unemployment + policyLagUnemployment + gdpImpact;
            unemployment = Math.max(3.0, Math.min(15.0, unemployment));

            // 3. Responsive Inflation Controls
            let monetaryCooling = contractionStrength > 0 ? -(contractionStrength * 0.22) : 0;
            inflationExpectations = (inflationExpectations * 0.85) + (inflation * 0.15);
            inflation = inflation + (gdp * 0.15) + (inflationExpectations * 0.1) + monetaryCooling - 0.15;
            inflation = Math.max(0.5, inflation);

            // 4. Stable Public Confidence Checks
            let inflationExcess = Math.max(0, inflation - 4.5);
            let confidencePenalty = Math.min(3.5, inflationExcess * 0.8);
            confidence -= confidencePenalty;

            if (interestRate >= inflation - 0.5 && inflation > 4.5) {
                confidence += 1.5;
            }
            if (unemployment > 8.0) confidence -= (unemployment - 8.0) * 0.8;
            if (gdp < -2.0) confidence -= 1.0;

            confidence = Math.max(0, Math.min(100, confidence));

            logAction();
        }

        function logAction() {
            let p = document.createElement('p');
            p.innerText = `Q${quarter}: Rate ${interestRate.toFixed(2)}% | Inf: ${inflation.toFixed(1)}% | GDP: ${gdp.toFixed(1)}% | Unemp: ${unemployment.toFixed(1)}% | Conf: ${Math.round(confidence)}`;
            logContainer.appendChild(p);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateInterface() {
            quarterVal.innerText = 'Q' + quarter;
            inflationVal.innerText = inflation.toFixed(1) + '%';
            gdpVal.innerText = gdp.toFixed(1) + '%';
            unemploymentVal.innerText = unemployment.toFixed(1) + '%';
            confidenceVal.innerText = Math.round(confidence);
        }
    </script>
</body>
</html>
